<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>Zone lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #lab-hud {
        position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px;
        font: 11px/1.4 ui-monospace, monospace; color: #8a97a6;
        background: linear-gradient(transparent, rgba(5, 7, 10, 0.85));
      }
      #lab-hud[hidden] { display: none; }
      #lab-readout { margin-bottom: 4px; white-space: pre; }
      #lab-slider { width: 100%; accent-color: #22c8ee; }
      .lab-anchor {
        position: fixed; width: 8px; height: 8px; margin: -4px 0 0 -4px; border: 1px solid #fff;
        border-radius: 50%; pointer-events: none; font: 9px/1 ui-monospace, monospace; color: #fff;
      }
      .lab-anchor span { position: absolute; left: 10px; top: -2px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <canvas id="lab-canvas"></canvas>
    <div id="lab-hud">
      <div id="lab-readout">loading...</div>
      <input id="lab-slider" type="range" min="0" max="1" step="1" value="0" aria-label="Scroll position" />
    </div>
    <script type="module" src="/src/scene/zone-lab.ts"></script>
  </body>
</html>
